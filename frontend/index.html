<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Service Desk</title>
<style>
:root{--p:#0075BF;--d:#009FE3;--b:#3C3C3C;--g:#94C11F;--o:#EF7D00;--bg:#f4f7fb;--l:#dbe5ee;--t:#101828}*{box-sizing:border-box}body{margin:0;font-family:'Segoe UI',Arial,sans-serif;background:var(--bg);color:var(--t)}button,input,select{font:inherit}button{cursor:pointer}.app{min-height:100vh;display:grid;grid-template-columns:250px minmax(0,1fr);grid-template-rows:64px 1fr}.top{grid-column:1/-1;background:var(--b);color:#fff;display:flex;align-items:center;gap:12px;padding:0 22px}.dot{width:12px;height:12px;border-radius:50%;background:var(--d)}.brand{font-size:22px;font-weight:900}.side{background:#fff;border-right:1px solid var(--l);padding:16px 12px;position:sticky;top:64px;height:calc(100vh - 64px)}.nav{width:100%;border:0;background:transparent;display:flex;gap:12px;align-items:center;padding:13px;border-radius:14px;margin-bottom:8px;font-weight:850;color:var(--b);white-space:nowrap;overflow:hidden}.nav:hover{background:#eef8fe}.nav.on{background:linear-gradient(90deg,var(--p),var(--d));color:#fff}.ico{width:30px;height:30px;border:1px solid currentColor;border-radius:10px;display:grid;place-items:center;flex:0 0 auto}.main{padding:24px;min-width:0;overflow:auto}.head{display:flex;justify-content:space-between;gap:14px;margin-bottom:16px}.head h1{margin:0}.muted{color:#607080}.card{background:#fff;border:1px solid var(--l);border-radius:22px;padding:20px;box-shadow:0 10px 24px #18324710;min-width:0}.grid{display:grid;gap:18px}.dash{grid-template-columns:1fr 1fr 1fr}.two{grid-template-columns:1fr 1fr}.three{grid-template-columns:repeat(3,1fr)}.btn{border:1px solid transparent;border-radius:13px;padding:10px 14px;background:var(--p);color:#fff;font-weight:900}.btn.sec{background:#fff;color:var(--p);border-color:var(--l)}.btn.good{background:var(--g);color:#243000}.btn.bad{background:#d92d20}.barbox{height:220px;display:flex;gap:12px;align-items:end;padding:22px 8px 40px}.baritem{flex:1;text-align:center;position:relative}.bar{margin:auto;width:65%;min-height:12px;border-radius:10px 10px 4px 4px;background:linear-gradient(180deg,var(--d),var(--p));position:relative}.bar.gray{background:#777}.bar.green{background:var(--g)}.bar.orange{background:var(--o)}.bar b{position:absolute;top:-28px;left:50%;transform:translateX(-50%);background:#eee;border-radius:6px;padding:3px 8px}.baritem small{position:absolute;left:-8px;right:-8px;bottom:-34px;font-size:12px;color:#52616b}.company{height:250px;overflow:auto;border:1px solid #eef2f6;border-radius:16px}.toolbar{display:grid;grid-template-columns:minmax(220px,1fr) 180px auto;gap:10px;margin-bottom:14px}input,select{width:100%;border:1px solid var(--l);border-radius:13px;padding:10px 12px;background:#fff}label{font-weight:800;display:grid;gap:6px;color:#344054}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}.tab{border:1px solid var(--l);background:#fff;border-radius:13px;padding:10px 13px;font-weight:900}.tab.on{background:var(--p);color:#fff}.wrap{overflow:auto;border-radius:16px;border:1px solid var(--l)}table{width:100%;min-width:720px;border-collapse:collapse;background:#fff}th,td{padding:12px;border-bottom:1px solid var(--l);text-align:left;vertical-align:top}th{font-size:12px;text-transform:uppercase;background:#f7fafc;color:#667085}.row{cursor:pointer}.row:hover{background:#f0f8ff}.badge{display:inline-flex;border-radius:999px;padding:5px 10px;background:#edf7fd;color:var(--p);font-weight:900;font-size:12px}.ok{background:#e9fff6;color:#027a48}.warn{background:#fff4e5;color:#b54708}.detail{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:18px}.form{display:grid;grid-template-columns:1fr 1fr;gap:14px}.full{grid-column:1/-1}.spec{display:grid;grid-template-columns:170px minmax(0,1fr);gap:12px;padding:7px 0}.spec span{color:#52616b}.sub{text-transform:uppercase;font-size:13px;font-weight:900;color:#52616b;margin:16px 0 8px;border-top:1px solid var(--l);padding-top:14px}.assetHead{display:flex;justify-content:space-between;gap:12px;margin-bottom:18px}.assetTitle{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.assetTitle h2{margin:0}.attach{display:grid;grid-template-columns:28px 1fr auto;gap:10px;align-items:center;border-bottom:1px solid var(--l);padding:12px 0}.step{display:flex;justify-content:space-between;gap:12px;align-items:center;border:1px solid var(--l);border-radius:16px;padding:14px;margin-top:10px}.toast{position:fixed;right:24px;bottom:24px;background:var(--b);color:#fff;border-radius:14px;padding:14px 18px;display:none}.toast.show{display:block}@media(max-width:1100px){.dash,.two,.three,.detail{grid-template-columns:1fr}.toolbar,.form{grid-template-columns:1fr}}@media(max-width:760px){.app{grid-template-columns:76px 1fr}.nav span:last-child{display:none}.main{padding:16px}.head,.assetHead{flex-direction:column}.spec{grid-template-columns:1fr}}
</style>
</head>
<body><div class="app"><header class="top"><span class="dot"></span><b class="brand">Service Desk</b><small>Protótipo interno</small></header><aside class="side"><button class="nav on" data-p="home"><span class="ico">⌂</span><span>Início</span></button><button class="nav" data-p="prep"><span class="ico">▣</span><span>Preparação de Máquina</span></button><button class="nav" data-p="backup"><span class="ico">⇄</span><span>Backup</span></button><button class="nav" data-p="tickets"><span class="ico">☰</span><span>Sistema de Chamados</span></button></aside><main class="main" id="app"></main></div><div class="toast" id="toast"></div>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m])),norm=s=>String(s??'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();let S={p:'home',btab:'lista',btabs:[],finish:false,ttab:'pesquisa',ttabs:[],assetEdit:null,q:'',aq:'',type:'Todos'};
let preps=[{tipo:'Admissão',nome:'Candidato Teste 001',status:'Finalizado RH',maq:'-',emp:'Atmis Gestão'},{tipo:'Troca',nome:'Colaborador Teste 002',status:'Preparando Maquina',maq:'NOTEGEO659',emp:'GEO'}],backups=[{id:'b1',col:'Colaborador Teste 001',note:'NOTEVEGA202',status:'Novo',ch:'000101',login:'login.teste001@empresa.com.br',senha:'senha-temporaria',gestor:'gestor.teste@empresa.com.br',falhas:'',dest:'Estoque',steps:{}},{id:'b2',col:'Colaborador Teste 002',note:'NOTEGESTAO192',status:'Andamento',ch:'000102',login:'login.teste002@empresa.com.br',senha:'senha-temporaria',gestor:'gestor.teste@empresa.com.br',falhas:'Aguardando conferência.',dest:'Manutenção',steps:{destino:true}}],tickets=[{id:'t1',num:'000201',tit:'Falha no Outlook',sol:'Pessoa Teste 001',emp:'Atmis',status:'Novo',fila:'Service Desk',resp:'Sem responsável',desc:'Usuário relata falha no Outlook no notebook NOTEGEO659.'},{id:'t2',num:'000202',tit:'Criação de acesso',sol:'Pessoa Teste 002',emp:'GEO',status:'Em atendimento',fila:'Redes',resp:'Analista Teste 001',desc:'Solicitação de acesso para novo colaborador.'}],assets=[{id:'a1',nome:'NOTEGEO659',tipo:'Computador',status:'Operacional',fab:'Dell',mod:'Dell G15 5530',proc:'i7-13650HX',mem:'16GB',arm:'NVMe 478GB +',serial:'3J3HQ34',compra:'04/03/2024',gar:'05/03/2025',nf:'263029',pat:'1816',emp:'Imagem Geosistemas',criado:'28/06/2024',modif:'11/11/2025',user:'Vítor Alves Souza',ult:'Vítor Alves Souza Tiago Fernandes Ribeiro',equip:'Ativo',bios:'senha-bios-teste',imagem:'senha-imagem-teste',mail:'vitor.teste@empresa.com.br',anex:[['263029.pdf','275.3 KB'],['Termo de Entrega.pdf','1.4 MB']]},{id:'a2',nome:'NOTEATMIS023',tipo:'Notebook',status:'Estoque',fab:'Dell',mod:'Latitude 3550',proc:'CORE i5',mem:'16GB',arm:'512GB SSD',serial:'SERIAL002',compra:'10/06/2025',gar:'10/06/2028',nf:'NF000002',pat:'PAT002',emp:'Atmis Gestão',criado:'10/06/2025',modif:'29/07/2026',user:'-',ult:'-',equip:'Ativo',bios:'senha-bios-teste',imagem:'senha-imagem-teste',mail:'-',anex:[]}];
function toast(t){let e=$('#toast');e.textContent=t;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),2200)}function page(p){S.p=p;document.querySelectorAll('.nav').forEach(b=>b.classList.toggle('on',b.dataset.p==p));render()}document.querySelectorAll('.nav').forEach(b=>b.onclick=()=>page(b.dataset.p));function bars(a,company=false){let m=Math.max(...a.map(x=>x[1]));return `<div class="barbox ${company?'company':''}">${a.map((x,i)=>`<div class="baritem"><div class="bar ${i%4==0?'gray':i%4==2?'green':i%4==3?'orange':''}" style="height:${Math.max(14,x[1]/m*(company?160:150))}px"><b>${x[1]}</b></div><small>${esc(x[0])}</small></div>`).join('')}</div>`}
function home(){return `<div class="head"><div><h1>Painel inicial</h1><p class="muted">Resumo rápido das preparações e do estoque de equipamentos.</p></div><button class="btn sec" data-toast="Painel atualizado.">Atualizar painel</button></div><div class="grid dash"><section class="card"><h2>Preparações</h2><div class="grid two"><div class="card"><span>Admissão</span><h1>${preps.filter(x=>x.tipo=='Admissão').length}</h1></div><div class="card"><span>Troca</span><h1>${preps.filter(x=>x.tipo=='Troca').length}</h1></div></div></section><section class="card"><h2>Estoque novo</h2>${bars([['Disponível',18],['Reservado',7],['Preparando',4],['Envio',3]])}</section><section class="card"><h2>Estoque usado</h2><p class="muted">Inclui usados separados para preparação.</p>${bars([['Disponível',12],['Manutenção',6],['Separado',5],['Avariado',2],['Em preparação',8]])}</section></div><div class="grid two" style="margin-top:18px"><section class="card"><h2>Estoque Novo</h2>${bars([['Imagem Geosistemas',24],['Kaffa Tech',4],['Imagem Gestão',3],['Imagem Sistemas',1]],true)}</section><section class="card"><h2>Estoque Usado</h2><p class="muted">Pode incluir equipamento em preparação, sem marcação separada.</p>${bars([['Vega Monitoramento',65],['Imagem Geosistemas',57],['Imagem Gestão',10],['CODEX',3],['Imagem Sistemas',3],['Optimus GIS',2]],true)}</section></div><div class="grid three" style="margin-top:18px"><section class="card"><h3>Busca melhor</h3><p>Pesquisa em chamados, ativos, pessoas e preparações.</p></section><section class="card"><h3>Banco próprio</h3><p>Pronto para índice/cache de busca.</p></section><section class="card"><h3>API própria</h3><p>Integrações ficam no backend.</p></section></div>`}
function prep(){return `<div class="head"><div><h1>Preparação de Máquinas</h1><p class="muted">Admissões e trocas.</p></div><button class="btn" data-toast="Nova preparação simulada.">+ Novo</button></div><div class="toolbar"><input placeholder="Candidato; ID da vaga; Máquina"><select><option>Todos</option><option>Finalizado RH</option><option>Preparando Maquina</option></select><button class="btn sec" data-toast="Banco atualizado.">Atualizar BD</button></div><div class="detail"><section class="card wrap"><table><thead><tr><th>Nome</th><th>Máquina</th><th>Status</th></tr></thead><tbody>${preps.map(p=>`<tr class="row"><td>${esc(p.nome)}</td><td>${esc(p.maq)}</td><td><span class="badge">${esc(p.status)}</span></td></tr>`).join('')}</tbody></table></section><aside class="card"><h2>Resumo</h2><p class="muted">Selecione uma preparação para abrir detalhes futuramente.</p></aside></div>`}
function backup(){let tabs=['lista',...S.btabs].map(t=>`<button class="tab ${S.btab==t?'on':''}" data-btab="${t}">${t=='lista'?'Lista de Backups':'Backup '+esc(backups.find(b=>b.id==t)?.note)}</button>`).join('');return `<div class="head"><div><h1>Backup</h1><p class="muted">Lista, execução e finalização.</p></div><button class="btn" id="newB">+ Novo chamado de backup</button></div><section class="card"><div class="tabs">${tabs}</div>${S.btab=='lista'?backupList():backupDetail(S.btab)}</section>`}function backupList(){return `<div class="toolbar"><input id="bq" placeholder="Pesquisar por note OU usuário"><select><option>Todos</option><option>Novo</option><option>Andamento</option><option>Finalizado</option></select></div><div class="wrap"><table><thead><tr><th>Notebook</th><th>Colaborador</th><th>Chamado</th><th>Status</th><th>Destino</th></tr></thead><tbody>${backups.map(b=>`<tr class="row" data-openb="${b.id}"><td><b>${esc(b.note)}</b></td><td>${esc(b.col)}</td><td>${esc(b.ch)}</td><td><span class="badge warn">${esc(b.status)}</span></td><td>${esc(b.dest)}</td></tr>`).join('')}</tbody></table></div>`}
function backupDetail(id){let b=backups.find(x=>x.id==id)||backups[0];return `<div><div class="head"><div><h2>${esc(b.note)}</h2><p class="muted">${esc(b.col)} • Chamado ${esc(b.ch)}</p></div><span class="badge">${esc(b.status)}</span></div><div class="card" style="background:#f8fbfd;margin-bottom:18px;display:grid;grid-template-columns:180px 1fr;gap:16px"><button class="btn" id="saveB">Salvar</button><h3 style="text-align:center;border-bottom:4px solid #073f5c;padding-bottom:10px;color:#073f5c">DADOS BACKUP</h3></div><form id="bf" class="form"><label class="full">Status<select name="status"><option ${b.status=='Novo'?'selected':''}>Novo</option><option ${b.status=='Andamento'?'selected':''}>Andamento</option><option ${b.status=='Finalizado'?'selected':''}>Finalizado</option></select></label><label>COLABORADOR<input name="col" value="${esc(b.col)}"></label><label>NOTEBOOK<input name="note" value="${esc(b.note)}"></label><label>LOGIN DO COLABORADOR<input name="login" value="${esc(b.login)}"></label><label>SENHA<input name="senha" value="${esc(b.senha)}"></label><label>E-MAIL DO GESTOR<input name="gestor" value="${esc(b.gestor)}"></label><label>FALHAS<input name="falhas" value="${esc(b.falhas)}"></label><label>N° Chamado<input name="ch" value="${esc(b.ch)}"></label><label>Destino ativo<select name="dest"><option ${b.dest=='Estoque'?'selected':''}>Estoque</option><option ${b.dest=='Manutenção'?'selected':''}>Manutenção</option><option ${b.dest=='Garantia'?'selected':''}>Garantia</option><option ${b.dest=='Em Processo de Descarte'?'selected':''}>Em Processo de Descarte</option></select></label></form><p style="text-align:right"><button class="btn sec" data-btab="lista">Voltar</button> <button class="btn good" id="finish">Continuar para finalização</button></p>${S.finish?finish(b):''}</div>`}
function finish(b){let a=[['email','Enviar e-mail ao gestor'],['chamado','Encerrar chamado'],['redes','Abrir chamado para Redes'],['desvincular','Desvincular ativo'],['destino','Definir destino']];return `<section class="card"><h2>Finalizar backup</h2>${a.map(x=>`<div class="step"><b>${x[1]}</b><button class="btn ${b.steps[x[0]]?'good':''}" data-step="${x[0]}">${b.steps[x[0]]?'Concluído':'Executar'}</button></div>`).join('')}</section>`}
function ticketsPage(){let tabs=['pesquisa','fila','ativos',...S.ttabs].map(t=>`<button class="tab ${S.ttab==t?'on':''}" data-ttab="${t}">${nameTab(t)}</button>`).join('');return `<div class="head"><div><h1>Sistema de Chamados</h1><p class="muted">Pesquisa global, fila e ativos.</p></div><button class="btn sec" data-toast="Dados sincronizados.">Atualizar</button></div><section class="card"><div class="tabs">${tabs}</div>${ticketContent()}</section>`}function nameTab(t){return t=='pesquisa'?'Pesquisa':t=='fila'?'Fila de Chamados':t=='ativos'?'Ativos':t=='novo'?'Novo Ativo':t.startsWith('t:')?'Chamado '+tickets.find(x=>x.id==t.slice(2))?.num:'Ativo '+assets.find(x=>x.id==t.slice(2))?.nome}
function ticketContent(){return S.ttab=='pesquisa'?searchTab():S.ttab=='fila'?fila():S.ttab=='ativos'?ativos():S.ttab=='novo'?novoAtivo():S.ttab.startsWith('t:')?detTicket(S.ttab.slice(2)):detAtivo(S.ttab.slice(2))}function openT(t){if(!['pesquisa','fila','ativos'].includes(t)&&!S.ttabs.includes(t))S.ttabs.push(t);S.ttab=t;render()}
function searchTab(){let res=[...tickets.map(t=>['Chamado',t.num+' - '+t.tit,t.sol+' • '+t.status,'t:'+t.id]),...assets.map(a=>['Ativo',a.nome+' - '+a.mod,a.user+' • '+a.status,'a:'+a.id])];return `<div class="toolbar"><input id="q" placeholder="Pesquisar chamado, ativo, colaborador, e-mail, máquina ou serial" value="${esc(S.q)}"><select id="type"><option>Todos</option><option>Chamados</option><option>Ativos</option><option>Pessoas</option></select></div><div class="grid">${res.filter(r=>!S.q||norm(r.join(' ')).includes(norm(S.q))).map(r=>`<button class="card row" data-opent="${r[3]}" style="text-align:left"><span class="badge">${r[0]}</span><h3>${esc(r[1])}</h3><p class="muted">${esc(r[2])}</p></button>`).join('')}</div>`}function fila(){return `<div class="toolbar"><input placeholder="Pesquisar na fila"><select><option>Todos status</option></select></div><div class="wrap"><table><thead><tr><th>Chamado</th><th>Título</th><th>Solicitante</th><th>Fila</th><th>Responsável</th><th>Status</th></tr></thead><tbody>${tickets.map(t=>`<tr class="row" data-opent="t:${t.id}"><td>${t.num}</td><td>${t.tit}</td><td>${t.sol}</td><td>${t.fila}</td><td>${t.resp}</td><td><span class="badge">${t.status}</span></td></tr>`).join('')}</tbody></table></div>`}function detTicket(id){let t=tickets.find(x=>x.id==id);return `<div class="detail"><section class="card"><h2>Chamado ${t.num}</h2><p>${t.desc}</p>${['sol','emp','fila','status','resp'].map(k=>`<div class="spec"><span>${k}</span><b>${esc(t[k])}</b></div>`).join('')}</section><aside class="card"><h3>Ações</h3><button class="btn" data-action="assumir" data-id="${id}">Assumir</button><br><br><button class="btn sec" data-action="remover" data-id="${id}">Remover responsável</button></aside></div>`}
function ativos(){let q=norm(S.aq);return `<div class="toolbar"><input id="aq" placeholder="Pesquisar ativo, serial, modelo ou usuário" value="${esc(S.aq)}"><select><option>Todos</option><option>Operacional</option><option>Estoque</option></select><button class="btn" data-opent="novo">+ Novo Ativo</button></div><div class="wrap"><table><thead><tr><th>Ativo</th><th>Modelo</th><th>Serial</th><th>Usuário</th><th>Empresa</th><th>Status</th></tr></thead><tbody>${assets.filter(a=>!q||norm(Object.values(a).join(' ')).includes(q)).map(a=>`<tr class="row" data-opent="a:${a.id}"><td><b>${a.nome}</b></td><td>${a.mod}</td><td>${a.serial}</td><td>${a.user}</td><td>${a.emp}</td><td><span class="badge ok">${a.status}</span></td></tr>`).join('')}</tbody></table></div>`}function detAtivo(id){let a=assets.find(x=>x.id==id),ed=S.assetEdit==id,row=(l,k)=>`<div class="spec"><span>${l}</span>${ed?`<input name="${k}" value="${esc(a[k])}">`:`<b>${esc(a[k])}</b>`}</div>`;return `<form id="af"><div class="assetHead"><div><button type="button" class="btn sec" data-ttab="ativos">← Ativos</button><div class="assetTitle"><h2>${a.nome}</h2><span class="badge">${a.tipo}</span><span class="badge ok">${a.status}</span></div><p class="muted">♙ ${a.user}</p></div><div>${ed?`<button type="button" class="btn" id="saveA">Salvar</button> <button type="button" class="btn sec" id="cancelA">Cancelar</button>`:`<button type="button" class="btn" id="editA">Editar ativo</button> <button type="button" class="btn sec" id="cloneA">Clonar ativo</button> <button type="button" class="btn bad" id="delA">Excluir ativo</button>`}</div></div><div class="detail"><section class="card"><h2>Especificações</h2><div class="sub">Hardware</div>${row('Fabricante','fab')}${row('Modelo','mod')}${row('Processador','proc')}${row('Memória RAM','mem')}${row('Armazenamento','arm')}${row('Série / tag','serial')}<div class="sub">Aquisição</div>${row('Data de compra','compra')}${row('Fim da garantia','gar')}${row('Nota fiscal','nf')}${row('Ativo fixo','pat')}${row('Empresa','emp')}<div class="sub">Registro</div>${row('Criado em','criado')}${row('Modificado em','modif')}${row('Status','status')}${row('Último usuário','ult')}<div class="sub">Outros</div>${row('Status do equipamento','equip')}${row('Senha BIOS','bios')}${row('Senha usuário imagem','imagem')}</section><aside><section class="card"><h3>Pessoas vinculadas</h3><p>♙ ${a.user}</p>${ed?`<label>Usuário<input form="af" name="user" value="${esc(a.user)}"></label>`:''}</section><br><section class="card"><h3>Anexos (${a.anex.length})</h3>${a.anex.map(x=>`<div class="attach"><span>📎</span><div><b>${x[0]}</b><br><span class="muted">${x[1]}</span></div><button type="button" class="btn sec">Baixar</button></div>`).join('')||'<p class="muted">Nenhum anexo.</p>'}</section></aside></div></form>`}
function next(prefix){let n=assets.map(a=>a.nome.startsWith(prefix)?parseInt(a.nome.slice(prefix.length)):0).filter(Boolean);return prefix+String(Math.max(0,...n)+1).padStart(3,'0')}function novoAtivo(){let p='NOTE';return `<section class="card"><h2>Novo Ativo</h2><div class="form"><label>Prefixo<input id="pref" value="${p}"></label><label>Quantidade<input id="qty" type="number" value="1"></label><label>Próximo<input readonly value="${next(p)}"></label><label>Modelo<input id="modNew" value="Latitude 3550"></label></div><br><button class="btn" id="createA">Criar ativo(s)</button></section>`}
function render(){try{$('#app').innerHTML=S.p=='home'?home():S.p=='prep'?prep():S.p=='backup'?backup():ticketsPage()}catch(e){$('#app').innerHTML=`<section class="card"><h2>Algo quebrou</h2><p>${esc(e.message)}</p><button class="btn" onclick="page('home')">Voltar</button></section>`}bind()}function bind(){document.querySelectorAll('[data-toast]').forEach(x=>x.onclick=()=>toast(x.dataset.toast));document.querySelectorAll('[data-btab]').forEach(x=>x.onclick=()=>{S.btab=x.dataset.btab;S.finish=false;render()});document.querySelectorAll('[data-openb]').forEach(x=>x.onclick=()=>{if(!S.btabs.includes(x.dataset.openb))S.btabs.push(x.dataset.openb);S.btab=x.dataset.openb;S.finish=false;render()});document.querySelectorAll('[data-ttab]').forEach(x=>x.onclick=()=>openT(x.dataset.ttab));document.querySelectorAll('[data-opent]').forEach(x=>x.onclick=()=>openT(x.dataset.opent));let q=$('#q');if(q)q.oninput=e=>{S.q=e.target.value;render()};let aq=$('#aq');if(aq)aq.oninput=e=>{S.aq=e.target.value;render()};let nb=$('#newB');if(nb)nb.onclick=()=>{let id='b'+Date.now();backups.unshift({id,col:'Novo colaborador',note:'-',status:'Novo',ch:String(100000+backups.length),login:'login.teste@empresa.com.br',senha:'senha-temporaria',gestor:'gestor.teste@empresa.com.br',falhas:'',dest:'Estoque',steps:{}});S.btabs.push(id);S.btab=id;render()};let sb=$('#saveB');if(sb)sb.onclick=()=>{Object.assign(backups.find(x=>x.id==S.btab),Object.fromEntries(new FormData($('#bf')).entries()));toast('Backup salvo.');render()};let f=$('#finish');if(f)f.onclick=()=>{S.finish=true;render()};document.querySelectorAll('[data-step]').forEach(x=>x.onclick=()=>{backups.find(b=>b.id==S.btab).steps[x.dataset.step]=true;toast('Etapa concluída.');render()});document.querySelectorAll('[data-action]').forEach(x=>x.onclick=()=>{let t=tickets.find(t=>t.id==x.dataset.id);if(x.dataset.action=='assumir')t.resp='Analista Teste 001';else t.resp='Sem responsável';toast('Chamado atualizado.');render()});let ea=$('#editA');if(ea)ea.onclick=()=>{S.assetEdit=S.ttab.slice(2);render()};let ca=$('#cancelA');if(ca)ca.onclick=()=>{S.assetEdit=null;render()};let sa=$('#saveA');if(sa)sa.onclick=()=>{Object.assign(assets.find(a=>a.id==S.assetEdit),Object.fromEntries(new FormData($('#af')).entries()),{modif:new Date().toLocaleDateString('pt-BR')});S.assetEdit=null;toast('Ativo salvo.');render()};let da=$('#delA');if(da)da.onclick=()=>{assets=assets.filter(a=>a.id!=S.ttab.slice(2));S.ttab='ativos';toast('Ativo excluído.');render()};let cl=$('#cloneA');if(cl)cl.onclick=()=>{openT('novo');toast('Clonagem iniciada.')};let cr=$('#createA');if(cr)cr.onclick=()=>{assets.push({...assets[1],id:'a'+Date.now(),nome:next('NOTE'),mod:$('#modNew').value});S.ttab='ativos';toast('Ativo criado.');render()}}render();
</script></body></html>
