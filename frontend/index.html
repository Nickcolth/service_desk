<style>
:root{--p:#0075BF;--d:#009FE3;--g:#287D25;--o:#EF7D00;--b:#3C3C3C;--bg:#f4f7fb;--line:#dbe5ee;--text:#17212b;--mut:#647480}*{box-sizing:border-box}body{margin:0;font-family:"Segoe UI",Arial,sans-serif;background:var(--bg);color:var(--text)}button,input,select,textarea{font:inherit}button{cursor:pointer;border:0}.shell{min-height:100vh;display:grid;grid-template-columns:268px minmax(0,1fr);grid-template-rows:72px 1fr}.top{grid-column:1/-1;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 26px;box-shadow:0 3px 14px #0f22300f}.brand{display:flex;align-items:center;gap:14px;font-size:25px;font-weight:900;color:var(--g)}.mark{width:42px;height:42px;border-radius:13px;background:var(--g);color:#fff;display:grid;place-items:center}.side{background:linear-gradient(180deg,#287D25,#1d5e1c);padding:22px 14px;display:flex;flex-direction:column;gap:10px}.nav{height:58px;border-radius:17px;background:transparent;color:#eaf3ea;display:grid;grid-template-columns:42px 1fr;align-items:center;text-align:left;padding:0 14px;font-weight:850}.nav:hover{background:#ffffff14}.nav.on{background:#fff;color:var(--g);box-shadow:0 10px 24px #0002}.ico{font-size:22px}.main{padding:24px;min-width:0}.head{display:flex;justify-content:space-between;gap:14px;margin-bottom:16px}.head h1{margin:0}.muted{color:var(--mut)}.card{background:#fff;border:1px solid var(--line);border-radius:22px;padding:20px;box-shadow:0 8px 22px #18324710;min-width:0}.grid{display:grid;gap:18px}.dash{grid-template-columns:1.1fr 1fr 1fr}.two{grid-template-columns:1fr 1fr}.btn{background:var(--p);color:#fff;border-radius:13px;padding:10px 14px;font-weight:900}.btn.sec{background:#fff;color:var(--p);border:1px solid var(--line)}.btn.bad{background:#c0392b}.btn.good{background:var(--g)}input,select,textarea{width:100%;border:1px solid var(--line);border-radius:13px;padding:10px 12px;background:#fff}label{display:grid;gap:6px;font-weight:800;color:#344054}.toolbar{display:grid;grid-template-columns:minmax(240px,1fr) repeat(3,170px);gap:10px;margin-bottom:14px}.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:16px}table{width:100%;min-width:900px;border-collapse:collapse;background:#fff}th,td{padding:12px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}th{background:#f7fafc;color:#52616b;font-size:12px;text-transform:uppercase}.click{cursor:pointer}.click:hover{background:#f0f8ff}.badge,.sla{display:inline-flex;border-radius:999px;padding:5px 10px;font-size:12px;font-weight:900;background:#edf7fd;color:#0a5d8f;white-space:nowrap}.badge.ok,.sla.ok{background:#eaf5eb;color:var(--g)}.badge.warn,.sla.prox{background:#fff6e6;color:#9a6000}.badge.danger,.sla.exp{background:#fff0f0;color:#a63a3a}.menu{display:flex;gap:8px;overflow:auto;border-bottom:1px solid var(--line);padding-bottom:8px;margin-bottom:12px}.tab{height:38px;border-radius:12px;background:#fff;border:1px solid var(--line);font-weight:900;padding:0 12px;white-space:nowrap}.tab.on{background:#eaf5eb;color:var(--g);border-color:#cce6ce}.inner-tabs{display:flex;gap:8px;overflow:auto;margin-bottom:12px}.x{margin-left:8px;color:#7b8790}.sort{display:inline-flex;gap:6px;align-items:center;background:transparent;color:#52616b;text-transform:uppercase;font-size:12px;font-weight:900;padding:0}.sort:hover{color:var(--p)}.alert{margin-bottom:14px;background:#fff6e6;border:1px solid #ffd59b;color:#8a4b00;border-radius:16px;padding:12px 14px;font-weight:800}.hint{background:#f8fbfc;border:1px dashed var(--line);border-radius:16px;padding:14px;color:#536579;margin-top:12px}.barbox{height:210px;display:flex;gap:12px;align-items:end;padding:22px 6px 54px}.baritem{flex:1;text-align:center;position:relative}.bar{margin:auto;width:62%;min-height:14px;border-radius:10px 10px 4px 4px;background:linear-gradient(180deg,var(--d),var(--p))}.baritem small{position:absolute;left:-8px;right:-8px;bottom:-44px;color:#52616b;font-size:12px}.baritem b{display:block;margin-top:6px;color:#111827}.form{display:grid;grid-template-columns:1fr 1fr;gap:14px}.full{grid-column:1/-1}.detail{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:18px}.kv{background:#f8fbfc;border:1px solid var(--line);border-radius:14px;padding:12px}.kv small{display:block;color:#697984;text-transform:uppercase;font-weight:900;font-size:11px}.kv strong{display:block;margin-top:6px}.toast{position:fixed;right:24px;bottom:24px;background:var(--b);color:#fff;border-radius:14px;padding:14px 18px;display:none;z-index:9}.toast.show{display:block}@media(max-width:1100px){.shell{grid-template-columns:86px 1fr}.nav span:last-child{display:none}.dash,.two,.detail,.form{grid-template-columns:1fr}.toolbar{grid-template-columns:1fr}.main{padding:18px}}
</style>
</head>
<body><div class="shell"><header class="top"><div class="brand"><span class="mark">S</span><span>Service Desk</span></div></header><aside class="side"><button class="nav on" data-nav="home"><span class="ico">⌂</span><span>Início</span></button><button class="nav" data-nav="prep"><span class="ico">▣</span><span>Preparação de Máquina</span></button><button class="nav" data-nav="backup"><span class="ico">⇄</span><span>Backup</span></button><button class="nav" data-nav="tickets"><span class="ico">☰</span><span>Sistema de Chamados</span></button></aside><main class="main" id="app"></main></div><div class="toast" id="toast"></div>
<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)],esc=s=>String(s??'').replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m])),norm=s=>String(s??'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
let S={page:'home',ticket:'fila',tabs:[],qFila:'',stFila:'Todos',slaFila:'Todos',respFila:'Todos',sortFila:'sla',dirFila:'asc',qAtivo:'',stAtivo:'Todos',empAtivo:'Todos',modAtivo:'Todos',sortAtivo:'nome',dirAtivo:'asc',qPessoa:'',sortPessoa:'nome',dirPessoa:'asc',qBusca:'',tipoBusca:'Todos',backup:'lista',backupTabs:[],final:false,assetEdit:null};
let chamados=[
{id:'ch1',num:'000001',tit:'Preparação de máquina para admissão',desc:'Criar usuário, preparar notebook e acompanhar envio.',sol:'Solicitante Teste',email:'solicitante.teste@empresa.com',emp:'Empresa Teste A',status:'Em atendimento',fila:'Service Desk',resp:'Analista Teste 001',upd:'Hoje 07:30',ativo:'NOTE001',sla:'2026-07-29T12:35:00-03:00'},
{id:'ch2',num:'000002',tit:'Solicitação de acesso e senha temporária',desc:'Usuário precisa de acesso inicial e validação de conta.',sol:'Candidato Teste 002',email:'usuario.teste002@email.com',emp:'Empresa Teste B',status:'Novo',fila:'Redes',resp:'Sem responsável',upd:'Ontem 16:22',ativo:'NOTE002',sla:'2026-07-29T13:20:00-03:00'},
{id:'ch3',num:'000003',tit:'Troca de notebook por upgrade',desc:'Colaborador solicitou troca de equipamento.',sol:'Colaborador Teste 003',email:'usuario.teste003@email.com',emp:'Empresa Teste A',status:'Aguardando usuário',fila:'Service Desk',resp:'Analista Teste 002',upd:'Hoje 06:50',ativo:'NOTE003',sla:'2026-07-29T16:30:00-03:00'},
{id:'ch4',num:'000004',tit:'Recolhimento de equipamento desligado',desc:'Recolher notebook, conferir backup e definir destino do ativo.',sol:'RH Teste',email:'rh.teste@empresa.com',emp:'Empresa Teste A',status:'Novo',fila:'Recolhimento',resp:'Sem responsável',upd:'Hoje 09:12',ativo:'NOTEVEGA202',sla:'2026-07-29T13:05:00-03:00'},
{id:'ch5',num:'000005',tit:'Aquisição de notebook para novo projeto',desc:'Solicitação de compra de notebook para nova equipe.',sol:'Gestor Teste',email:'gestor.teste@empresa.com',emp:'Empresa Teste C',status:'Em cotação',fila:'Aquisição',resp:'Analista Teste 003',upd:'Hoje 10:05',ativo:'-',sla:'2026-07-29T17:00:00-03:00'}];
let ativos=[
{id:'a1',nome:'NOTEGEO659',tipo:'Notebook',status:'Operacional',fab:'Dell',modelo:'Dell G15 5530',serial:'3J3HQ34',pat:'1816',emp:'Imagem Geosistemas',user:'Colaborador Teste 001',mail:'usuario.teste001@empresa.com.br',nf:'263029',proc:'i7-13650HX',mem:'16GB',arm:'NVMe 478GB +'},
{id:'a2',nome:'NOTEATMIS024',tipo:'Notebook',status:'Operacional',fab:'Dell',modelo:'Latitude 3550',serial:'SERIE024',pat:'1824',emp:'Atmis Gestão',user:'Colaborador Teste 002',mail:'usuario.teste002@empresa.com.br',nf:'NF000024',proc:'CORE i5',mem:'16GB',arm:'512GB SSD'},
{id:'a3',nome:'NOTE003',tipo:'Notebook',status:'Estoque',fab:'Dell',modelo:'Vostro 3520',serial:'SERIE003',pat:'ATV0003',emp:'Empresa Teste A',user:'-',mail:'-',nf:'NF000003',proc:'CORE i5',mem:'8GB',arm:'256GB SSD'},
{id:'a4',nome:'NOTEVEGA202',tipo:'Notebook',status:'Manutenção',fab:'Dell',modelo:'Latitude 3550',serial:'SERIE202',pat:'ATV0202',emp:'Vega Monitoramento',user:'Colaborador Desligado',mail:'desligado@empresa.com.br',nf:'NF000202',proc:'CORE i5',mem:'16GB',arm:'512GB SSD'}];
let preps=[{id:'p1',tipo:'Admissão',nome:'Candidato Teste 001',status:'Finalizado RH',maq:'-',emp:'Empresa Teste A',email:'usuario.teste@email.com'},{id:'p2',tipo:'Troca',nome:'Colaborador Teste 003',status:'Preparando Maquina',maq:'NOTE003',emp:'Empresa Teste A',email:'usuario.teste003@email.com'}];
let backups=[{id:'b1',col:'Colaborador Teste 001',note:'NOTEVEGA202',login:'login.teste001@empresa.com.br',gestor:'gestor.teste@empresa.com.br',ch:'000101',status:'Novo',dest:'Estoque',steps:{}},{id:'b2',col:'Colaborador Teste 002',note:'NOTEGESTAO192',login:'login.teste002@empresa.com.br',gestor:'gestor.teste@empresa.com.br',ch:'000102',status:'Andamento',dest:'Manutenção',steps:{destino:true}}];

function toast(t){let e=$('#toast');e.textContent=t;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),2200)}function cmp(a,b){return String(a??'').localeCompare(String(b??''),'pt-BR',{numeric:true,sensitivity:'base'})}function setPage(p){S.page=p;if(p==='tickets'&&!S.ticket)S.ticket='fila';render()}function nav(){ $$('.nav').forEach(b=>b.classList.toggle('on',b.dataset.nav===S.page)); }function badge(s){let c=s==='Novo'||s==='Finalizado'?'ok':s.includes('Aguardando')||s.includes('cotação')?'warn':'';return `<span class="badge ${c}">${esc(s)}</span>`}
function bars(a){let m=Math.max(...a.map(x=>x[1]));return `<div class="barbox">${a.map(x=>`<div class="baritem"><div class="bar" style="height:${Math.max(14,x[1]/m*145)}px"></div><small>${esc(x[0])}<b>${x[1]}</b></small></div>`).join('')}</div>`}
function home(){return `<div class="head"><div><h1>Painel inicial</h1><p class="muted">Resumo rápido das preparações e do estoque de equipamentos.</p></div><button class="btn sec" data-msg="Painel atualizado.">Atualizar painel</button></div><div class="grid dash"><section class="card"><h2>Preparações</h2><div class="grid two"><div class="card"><span>Admissão</span><h1>${preps.filter(x=>x.tipo==='Admissão').length}</h1></div><div class="card"><span>Troca</span><h1>${preps.filter(x=>x.tipo==='Troca').length}</h1></div></div></section><section class="card"><h2>Estoque novo</h2>${bars([['Disponível',18],['Reservado',7],['Preparando',4],['Envio',3]])}</section><section class="card"><h2>Estoque usado</h2>${bars([['Disponível',12],['Manutenção',6],['Separado',5],['Avariado',2],['Em preparação',8]])}</section></div><div class="grid two" style="margin-top:18px"><section class="card"><h2>Estoque Novo</h2>${bars([['Imagem Geosistemas',24],['Kaffa Tech',4],['Imagem Gestão',3],['Imagem Sistemas',1]])}</section><section class="card"><h2>Estoque Usado</h2>${bars([['Vega Monitoramento',65],['Imagem Geosistemas',57],['Imagem Gestão',10],['CODEX',3],['Imagem Sistemas',3],['Optimus GIS',2]])}</section></div>`}
function prep(){return `<div class="head"><div><h1>Preparação de Máquinas</h1><p class="muted">Admissões e trocas.</p></div><button class="btn">+ Novo</button></div><section class="card"><div class="toolbar"><input placeholder="Candidato; ID da vaga; Máquina"><select><option>Todos</option><option>Finalizado RH</option><option>Preparando Maquina</option></select><button class="btn sec">Atualizar BD</button></div><div class="table-wrap"><table><thead><tr><th>Nome</th><th>Empresa</th><th>Máquina</th><th>Status</th></tr></thead><tbody>${preps.map(p=>`<tr><td>${esc(p.nome)}</td><td>${esc(p.emp)}</td><td>${esc(p.maq)}</td><td>${badge(p.status)}</td></tr>`).join('')}</tbody></table></div></section>`}
function sla(c){let due=new Date(c.sla),now=new Date('2026-07-29T12:50:00-03:00'),min=Math.round((due-now)/60000);if(min<0)return{rank:0,cls:'exp',txt:`Expirado há ${Math.abs(min)} min`,due};if(min<=60)return{rank:1,cls:'prox',txt:`Vence em ${min} min`,due};return{rank:2,cls:'ok',txt:`Vence em ${Math.floor(min/60)}h${String(min%60).padStart(2,'0')}`,due}}function slaHtml(c){let s=sla(c);return `<span class="sla ${s.cls}">${s.txt}</span>`}
function qRowsBase(){if(S.ticket==='recolhimento')return chamados.filter(c=>c.fila==='Recolhimento');if(S.ticket==='aquisicao')return chamados.filter(c=>c.fila==='Aquisição');return chamados.filter(c=>!['Recolhimento','Aquisição'].includes(c.fila))}function qVal(c,k){return k==='sla'?sla(c).rank*1e14+sla(c).due.getTime():c[k]??''}function qRows(rows){let q=norm(S.qFila);let list=rows.filter(c=>(!q||norm(`${c.num} ${c.tit} ${c.sol} ${c.status} ${c.resp}`).includes(q))&&(S.stFila==='Todos'||c.status===S.stFila)&&(S.slaFila==='Todos'||sla(c).cls===S.slaFila)&&(S.respFila==='Todos'||c.resp===S.respFila));let dir=S.dirFila==='desc'?-1:1;return list.sort((a,b)=>(typeof qVal(a,S.sortFila)==='number'?qVal(a,S.sortFila)-qVal(b,S.sortFila):cmp(qVal(a,S.sortFila),qVal(b,S.sortFila)))*dir||sla(a).rank-sla(b).rank)}function sortHead(kind,k,l){let active=S[kind]===k,dir=S[kind.replace('sort','dir')];return `<button class="sort" data-sort-kind="${kind}" data-sort="${k}">${l}<span>${active?(dir==='desc'?'▼':'▲'):'↕'}</span></button>`}
function queue(title,subtitle,rows){let crit=rows.filter(c=>sla(c).rank<2).length,status=['Todos',...new Set(rows.map(c=>c.status))],resp=['Todos',...new Set(rows.map(c=>c.resp))];return `<section class="card"><h2>${title}</h2><p class="muted">${subtitle}</p>${crit?`<div class="alert"><strong>${crit}</strong> chamado(s) com SLA próximo de expirar ou expirado aparecem primeiro automaticamente.</div>`:''}<div class="toolbar"><input id="qFila" value="${esc(S.qFila)}" placeholder="Pesquisar por número, título, solicitante ou responsável"><select id="stFila">${status.map(x=>`<option ${S.stFila===x?'selected':''}>${esc(x)}</option>`).join('')}</select><select id="slaFila"><option value="Todos" ${S.slaFila==='Todos'?'selected':''}>Todos SLA</option><option value="exp" ${S.slaFila==='exp'?'selected':''}>SLA expirado</option><option value="prox" ${S.slaFila==='prox'?'selected':''}>SLA próximo</option><option value="ok" ${S.slaFila==='ok'?'selected':''}>No prazo</option></select><select id="respFila">${resp.map(x=>`<option ${S.respFila===x?'selected':''}>${esc(x)}</option>`).join('')}</select></div><div class="hint"><strong>Ordenação:</strong> clique no cabeçalho da coluna para ordenar. Clique de novo para inverter.</div><div class="table-wrap"><table><thead><tr><th>${sortHead('sortFila','num','Número')}</th><th>${sortHead('sortFila','tit','Título')}</th><th>${sortHead('sortFila','sol','Solicitante')}</th><th>${sortHead('sortFila','status','Status')}</th><th>${sortHead('sortFila','sla','SLA')}</th><th>${sortHead('sortFila','fila','Fila')}</th><th>${sortHead('sortFila','resp','Responsável')}</th><th>${sortHead('sortFila','upd','Atualizado')}</th><th>Abrir</th></tr></thead><tbody>${qRows(rows).map(c=>`<tr class="click" data-open="ch:${c.id}"><td>${esc(c.num)}</td><td>${esc(c.tit)}</td><td>${esc(c.sol)}</td><td>${badge(c.status)}</td><td>${slaHtml(c)}</td><td>${esc(c.fila)}</td><td>${esc(c.resp)}</td><td>${esc(c.upd)}</td><td><button class="btn sec" data-open="ch:${c.id}">Abrir</button></td></tr>`).join('')||`<tr><td colspan="9"><div class="hint">Nenhum chamado encontrado nesta fila.</div></td></tr>`}</tbody></table></div></section>`}
function people(){let m=new Map(),add=(nome,email,emp,orig,ativo,id)=>{if(!nome||nome==='-')return;let k=norm(email||nome),p=m.get(k)||{nome,email:email||'-',emp:emp||'-',orig:new Set(),ativo:[],id:''};p.orig.add(orig);if(ativo)p.ativo.push(ativo);if(id)p.id=id;m.set(k,p)};ativos.forEach(a=>add(a.user,a.mail,a.emp,'Ativo vinculado',a.nome,a.id));chamados.forEach(c=>add(c.sol,c.email,c.emp,'Chamado',c.num,''));preps.forEach(p=>add(p.nome,p.email,p.emp,'Preparação',p.maq,''));let arr=[...m.values()].map(p=>({...p,origem:[...p.orig].join(', '),ref:p.ativo.join(', ')||'-'}));let q=norm(S.qPessoa);arr=arr.filter(p=>!q||norm(`${p.nome} ${p.email} ${p.emp} ${p.origem} ${p.ref}`).includes(q));let dir=S.dirPessoa==='desc'?-1:1;arr.sort((a,b)=>cmp(a[S.sortPessoa],b[S.sortPessoa])*dir);return `<section class="card"><h2>Pessoas</h2><p class="muted">Consulta de colaboradores, solicitantes e candidatos.</p><div class="toolbar" style="grid-template-columns:minmax(260px,1fr) 160px"><input id="qPessoa" value="${esc(S.qPessoa)}" placeholder="Pesquisar pessoa, e-mail, empresa, ativo ou origem"><button class="btn sec">Atualizar pessoas</button></div><div class="table-wrap"><table><thead><tr><th>${sortHead('sortPessoa','nome','Pessoa')}</th><th>${sortHead('sortPessoa','email','E-mail')}</th><th>${sortHead('sortPessoa','emp','Empresa')}</th><th>${sortHead('sortPessoa','origem','Origem')}</th><th>${sortHead('sortPessoa','ref','Ativo / referência')}</th></tr></thead><tbody>${arr.map(p=>`<tr class="${p.id?'click':''}" ${p.id?`data-open="atv:${p.id}"`:''}><td><b>${esc(p.nome)}</b></td><td>${esc(p.email)}</td><td>${esc(p.emp)}</td><td>${esc(p.origem)}</td><td>${esc(p.ref)}</td></tr>`).join('')}</tbody></table></div></section>`}
function ativosTab(){let emp=['Todos',...new Set(ativos.map(a=>a.emp))],mod=['Todos',...new Set(ativos.map(a=>a.modelo))],st=['Todos',...new Set(ativos.map(a=>a.status))],q=norm(S.qAtivo);let list=ativos.filter(a=>(!q||norm(Object.values(a).join(' ')).includes(q))&&(S.stAtivo==='Todos'||a.status===S.stAtivo)&&(S.empAtivo==='Todos'||a.emp===S.empAtivo)&&(S.modAtivo==='Todos'||a.modelo===S.modAtivo));let dir=S.dirAtivo==='desc'?-1:1;list.sort((a,b)=>cmp(a[S.sortAtivo],b[S.sortAtivo])*dir);return `<section class="card"><div class="head"><div><h2>Ativos</h2><p class="muted">Filtre por status, empresa, modelo e ordene pelo cabeçalho.</p></div><button class="btn">+ Novo Ativo</button></div><div class="toolbar" style="grid-template-columns:minmax(240px,1fr) 170px 190px 190px"><input id="qAtivo" value="${esc(S.qAtivo)}" placeholder="Pesquisar ativo, serial, patrimônio, usuário, modelo ou empresa"><select id="stAtivo">${st.map(x=>`<option ${S.stAtivo===x?'selected':''}>${esc(x)}</option>`).join('')}</select><select id="empAtivo">${emp.map(x=>`<option ${S.empAtivo===x?'selected':''}>${esc(x)}</option>`).join('')}</select><select id="modAtivo">${mod.map(x=>`<option ${S.modAtivo===x?'selected':''}>${esc(x)}</option>`).join('')}</select></div><div class="table-wrap"><table><thead><tr><th>${sortHead('sortAtivo','nome','Ativo')}</th><th>${sortHead('sortAtivo','user','Usuário vinculado')}</th><th>${sortHead('sortAtivo','modelo','Modelo')}</th><th>${sortHead('sortAtivo','serial','Serial')}</th><th>${sortHead('sortAtivo','emp','Empresa')}</th><th>${sortHead('sortAtivo','status','Status')}</th></tr></thead><tbody>${list.map(a=>`<tr class="click" data-open="atv:${a.id}"><td><b>${esc(a.nome)}</b></td><td>${esc(a.user)}</td><td>${esc(a.modelo)}</td><td>${esc(a.serial)}</td><td>${esc(a.emp)}</td><td>${badge(a.status)}</td></tr>`).join('')}</tbody></table></div></section>`}
function busca(){let q=norm(S.qBusca),res=[];if(q){let mt=o=>norm(Object.values(o).join(' ')).includes(q);if(['Todos','Chamados'].includes(S.tipoBusca))chamados.forEach(c=>{if(mt(c))res.push(['Chamado',`Chamado ${c.num} - ${c.tit}`,`${c.sol} • ${c.status} • ${c.fila}`,'ch:'+c.id])});if(['Todos','Ativos'].includes(S.tipoBusca))ativos.forEach(a=>{if(mt(a))res.push(['Ativo',`${a.nome} - ${a.modelo}`,`${a.user} • ${a.serial} • ${a.status}`,'atv:'+a.id])});if(['Todos','Pessoas'].includes(S.tipoBusca))ativos.forEach(a=>{if(mt({n:a.user,e:a.mail,emp:a.emp,at:a.nome}))res.push(['Pessoa',a.user,`${a.mail} • ${a.emp} • ${a.nome}`,'atv:'+a.id])});if(['Todos','Preparações'].includes(S.tipoBusca))preps.forEach(p=>{if(mt(p))res.push(['Preparação',`${p.tipo} - ${p.nome}`,`${p.emp} • ${p.maq} • ${p.status}`,''])})}return `<section class="card"><h2>Pesquisa global</h2><label>Campo único de pesquisa<input id="qBusca" value="${esc(S.qBusca)}" placeholder="Ex: número do chamado, notebook, colaborador, e-mail, serial, patrimônio ou descrição" autocomplete="off"></label><div style="display:flex;gap:8px;flex-wrap:wrap;margin:14px 0">${['Todos','Chamados','Ativos','Pessoas','Preparações'].map(t=>`<button class="tab ${S.tipoBusca===t?'on':''}" data-tipo="${t}">${t}</button>`).join('')}</div><div class="grid">${S.qBusca?(res.map(r=>`<button class="card click" data-open="${esc(r[3])}" style="text-align:left"><span class="badge">${r[0]}</span><h3>${esc(r[1])}</h3><p class="muted">${esc(r[2])}</p></button>`).join('')||'<div class="hint">Nenhum resultado encontrado.</div>'):'<div class="hint"><b>Como usar:</b> digite no campo acima e depois escolha o filtro, se quiser limitar o resultado.</div>'}</div></section>`}
function chamado(id){let c=chamados.find(x=>x.id===id)||chamados[0];return `<div class="detail"><section class="card"><h2>Chamado ${esc(c.num)} - ${esc(c.tit)}</h2><p class="muted">${esc(c.desc)}</p><div class="grid two">${[['Solicitante',c.sol],['E-mail',c.email],['Empresa',c.emp],['Status',c.status],['Fila',c.fila],['Responsável',c.resp],['Ativo',c.ativo],['SLA',sla(c).txt]].map(x=>`<div class="kv"><small>${x[0]}</small><strong>${esc(x[1])}</strong></div>`).join('')}</div></section><aside class="card"><h3>Ações</h3><select id="respChamado">${analysts.map(a=>`<option ${a===c.resp?'selected':''}>${a}</option>`).join('')}</select><br><br><button class="btn" data-act="assumir">Assumir chamado</button> <button class="btn sec" data-act="resp">Alterar responsável</button></aside></div>`}
function ativo(id){let a=ativos.find(x=>x.id===id)||ativos[0];return `<div class="detail"><section class="card"><button class="btn sec" data-fixed="ativos">← Ativos</button><h2>${esc(a.nome)}</h2><p class="muted">${esc(a.tipo)} • ${esc(a.status)} • ${esc(a.user)}</p><div class="grid two">${[['Fabricante',a.fab],['Modelo',a.modelo],['Processador',a.proc],['Memória',a.mem],['Armazenamento',a.arm],['Serial',a.serial],['Patrimônio',a.pat],['Nota fiscal',a.nf],['Empresa',a.emp],['Usuário',a.user],['E-mail',a.mail],['Status',a.status]].map(x=>`<div class="kv"><small>${x[0]}</small><strong>${esc(x[1])}</strong></div>`).join('')}</div></section><aside class="card"><h3>Ações</h3><button class="btn">Editar ativo</button> <button class="btn sec">Clonar</button> <button class="btn bad">Excluir</button><h3>Anexos</h3><div class="hint">Nenhum anexo real neste mock.</div></aside></div>`}
function backup(){let tabs=['lista',...S.backupTabs].map(t=>`<button class="tab ${S.backup===t?'on':''}" data-btab="${t}">${t==='lista'?'Lista de Backups':'Backup '+(backups.find(b=>b.id===t)?.note||'')} ${t!=='lista'?'<span class="x">×</span>':''}</button>`).join('');return `<div class="head"><div><h1>Backup</h1><p class="muted">Lista, execução e finalização de backups.</p></div><button class="btn" id="newB">+ Novo chamado de backup</button></div><section class="card"><div class="inner-tabs">${tabs}</div>${S.backup==='lista'?backupList():backupDetail(S.backup)}</section>`}function backupList(){return `<div class="table-wrap"><table><thead><tr><th>Notebook</th><th>Colaborador</th><th>Status</th><th>Chamado</th><th>Destino</th></tr></thead><tbody>${backups.map(b=>`<tr class="click" data-openb="${b.id}"><td><b>${esc(b.note)}</b></td><td>${esc(b.col)}</td><td>${badge(b.status)}</td><td>${esc(b.ch)}</td><td>${esc(b.dest)}</td></tr>`).join('')}</tbody></table></div>`}function backupDetail(id){let b=backups.find(x=>x.id===id)||backups[0];if(S.final)return `<div><h2>Finalizar backup</h2><div class="grid">${['Enviar e-mail ao gestor','Encerrar chamado','Abrir chamado para Redes','Desvincular colaborador do ativo','Definir destino do ativo'].map((x,i)=>`<div class="card"><b>${x}</b><button class="btn good" style="float:right" data-msg="Etapa concluída.">Concluir</button></div>`).join('')}</div><p><button class="btn sec" id="backB">Voltar para dados do backup</button></p></div>`;return `<div><h2>${esc(b.note)}</h2><p class="muted">${esc(b.col)} • Chamado ${esc(b.ch)}</p><div class="form"><label class="full">Status<select><option>${esc(b.status)}</option><option>Novo</option><option>Andamento</option><option>Finalizado</option></select></label><label>Colaborador<input value="${esc(b.col)}"></label><label>Notebook<input value="${esc(b.note)}"></label><label>Login<input value="${esc(b.login)}"></label><label>E-mail gestor<input value="${esc(b.gestor)}"></label><label>Nº chamado<input value="${esc(b.ch)}"></label><label>Destino ativo<select><option>${esc(b.dest)}</option><option>Estoque</option><option>Manutenção</option><option>Garantia</option><option>Em Processo de Descarte</option></select></label></div><p style="text-align:right"><button class="btn" id="finB">Continuar para finalização</button></p></div>`}
function ticketContent(){if(S.ticket==='fila')return queue('Fila de Chamados','Chamados operacionais do Service Desk.',qRowsBase());if(S.ticket==='recolhimento')return queue('Fila de Recolhimento','Chamados para recolher equipamento, conferir backup e definir destino do ativo.',qRowsBase());if(S.ticket==='aquisicao')return queue('Fila de Aquisição','Solicitações de compra, cotação e entrada de novos equipamentos.',qRowsBase());if(S.ticket==='ativos')return ativosTab();if(S.ticket==='pessoas')return people();if(S.ticket==='pesquisa')return busca();if(S.ticket.startsWith('ch:'))return chamado(S.ticket.slice(3));if(S.ticket.startsWith('atv:'))return ativo(S.ticket.slice(4));return ''}
function tickets(){let fixed=[['fila','Fila de Chamados'],['recolhimento','Fila de Recolhimento'],['aquisicao','Fila de Aquisição'],['ativos','Ativos'],['pessoas','Pessoas'],['pesquisa','Pesquisa']];let dyn=S.tabs.map(t=>`<button class="tab ${S.ticket===t?'on':''}" data-dyn="${t}">${t.startsWith('ch:')?'Chamado '+(chamados.find(c=>c.id===t.slice(3))?.num||''):t.startsWith('atv:')?'Ativo '+(ativos.find(a=>a.id===t.slice(4))?.nome||''):t}<span class="x">×</span></button>`).join('');return `<div class="head"><div><h1>Sistema de Chamados</h1><p class="muted">Fila operacional, pesquisa global, gestão de ativos e pessoas.</p></div><button class="btn sec" data-msg="Dados sincronizados.">Atualizar</button></div><section><div class="menu">${fixed.map(x=>`<button class="tab ${S.ticket===x[0]?'on':''}" data-fixed="${x[0]}">${x[1]}</button>`).join('')}</div>${dyn?`<div class="inner-tabs">${dyn}</div>`:''}${ticketContent()}</section>`}
function openT(k){if(k&&k!==''){if(!['fila','recolhimento','aquisicao','ativos','pessoas','pesquisa'].includes(k)&&!S.tabs.includes(k))S.tabs.push(k);S.ticket=k;render()}}
function render(){nav();$('#app').innerHTML=S.page==='home'?home():S.page==='prep'?prep():S.page==='backup'?backup():tickets();bind()}function bind(){$$('[data-nav]').forEach(b=>b.onclick=()=>{S.page=b.dataset.nav; if(S.page==='tickets'&&!S.ticket)S.ticket='fila'; render()});$$('[data-msg]').forEach(b=>b.onclick=()=>toast(b.dataset.msg));$$('[data-fixed]').forEach(b=>b.onclick=()=>{S.ticket=b.dataset.fixed;if(['fila','recolhimento','aquisicao'].includes(S.ticket)){S.qFila='';S.stFila='Todos';S.slaFila='Todos';S.respFila='Todos';S.sortFila='sla';S.dirFila='asc'}render()});$$('[data-dyn]').forEach(b=>b.onclick=e=>{let k=b.dataset.dyn;if(e.target.classList.contains('x')){S.tabs=S.tabs.filter(t=>t!==k);S.ticket='fila'}else S.ticket=k;render()});$$('[data-open]').forEach(e=>e.onclick=ev=>{ev.stopPropagation();openT(e.dataset.open)});$$('[data-sort]').forEach(h=>h.onclick=()=>{let kind=h.dataset.sortKind,k=h.dataset.sort,dir=kind.replace('sort','dir');if(S[kind]===k)S[dir]=S[dir]==='asc'?'desc':'asc';else{S[kind]=k;S[dir]='asc'}render()});let q=$('#qFila');if(q)q.oninput=e=>{S.qFila=e.target.value;render()};let st=$('#stFila');if(st)st.onchange=e=>{S.stFila=e.target.value;render()};let sl=$('#slaFila');if(sl)sl.onchange=e=>{S.slaFila=e.target.value;render()};let rp=$('#respFila');if(rp)rp.onchange=e=>{S.respFila=e.target.value;render()};let qa=$('#qAtivo');if(qa)qa.oninput=e=>{S.qAtivo=e.target.value;render()};let sta=$('#stAtivo');if(sta)sta.onchange=e=>{S.stAtivo=e.target.value;render()};let ea=$('#empAtivo');if(ea)ea.onchange=e=>{S.empAtivo=e.target.value;render()};let ma=$('#modAtivo');if(ma)ma.onchange=e=>{S.modAtivo=e.target.value;render()};let qp=$('#qPessoa');if(qp)qp.oninput=e=>{S.qPessoa=e.target.value;render()};let qb=$('#qBusca');if(qb)qb.oninput=e=>{S.qBusca=e.target.value;let box=$('#app');render()};$$('[data-tipo]').forEach(b=>b.onclick=()=>{S.tipoBusca=b.dataset.tipo;render()});$$('[data-openb]').forEach(r=>r.onclick=()=>{if(!S.backupTabs.includes(r.dataset.openb))S.backupTabs.push(r.dataset.openb);S.backup=r.dataset.openb;S.final=false;render()});$$('[data-btab]').forEach(b=>b.onclick=e=>{let k=b.dataset.btab;if(e.target.classList.contains('x')){S.backupTabs=S.backupTabs.filter(x=>x!==k);S.backup='lista'}else S.backup=k;S.final=false;render()});let nb=$('#newB');if(nb)nb.onclick=()=>{let id='b'+Date.now();backups.unshift({id,col:'Novo colaborador',note:'-',login:'login@empresa.com',gestor:'gestor@empresa.com',ch:String(100000+backups.length),status:'Novo',dest:'Estoque',steps:{}});S.backupTabs.unshift(id);S.backup=id;render()};let fb=$('#finB');if(fb)fb.onclick=()=>{S.final=true;render()};let bb=$('#backB');if(bb)bb.onclick=()=>{S.final=false;render()};$$('[data-act]').forEach(b=>b.onclick=()=>{let c=chamados.find(x=>'ch:'+x.id===S.ticket);if(!c)return;if(b.dataset.act==='assumir')c.resp='Analista Teste 001';if(b.dataset.act==='resp')c.resp=$('#respChamado').value;toast('Chamado atualizado.');render()})}render();
</script></body></html>
